services:
  teamspeak:
    image: teamspeak:latest
    container_name: ts3-server
    restart: unless-stopped
    ports:
      - "9987:9987/udp"   # Voz
      - "10011:10011/tcp" # ServerQuery (admin)
      - "30033:30033/tcp" # Transferencia de archivos
    environment:
      TS3SERVER_LICENSE: ${TS3SERVER_LICENSE:-accept}
    volumes:
      - ts3-data:/var/ts3server/

  audiobot:
    build: ./audiobot
    container_name: ts3-audiobot
    restart: unless-stopped
    # Comparte la red del servicio "teamspeak" (mismo netns, habla por 127.0.0.1) en vez de
    # una network de Docker Compose propia: los builds de TS3AudioBot no resuelven bien el
    # nombre de servicio ("Could not read or resolve address"), ver audiobot/entrypoint.sh.
    network_mode: "service:teamspeak"
    depends_on:
      - teamspeak
    volumes:
      - ts3ab-data:/data

volumes:
  ts3-data:
    name: ts3-data
  ts3ab-data:
    name: ts3ab-data
